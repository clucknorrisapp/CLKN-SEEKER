# Does the Android side actually COMPILE?
#
# Written 2026-09-21. Until now nothing had ever compiled the CluckMWA Kotlin plugin — it was
# written, reviewed against the documented clientlib API, and never built once, because no
# session container has an Android SDK. "It should compile" is not a fact, and the CLOCK IN
# submission needs a functional APK on 2026-10-09.
#
# ⚠️ This job deliberately builds the SOLANA target, not the seeker one. The seeker target
# refuses to build without a pinned, checksummed release (a tag only the owner can push) and
# that refusal is correct — faking a pin to make CI green would be the exact false success this
# project keeps paying for. But the plugin lives in android/app/src/wallet, on the source path of
# every target except the education one (-PclknWallet=false), so this default assemble compiles it. This answers the compile question today without weakening the pin.
#
# What a green run here does and does not mean:
#   ✅ the Kotlin compiles, the clientlib resolves, the plugin registers, an APK is produced
#   ❌ it does NOT mean the wallet connects, or that anything signs — that needs a real device
#      with a real wallet, and is the 10-step checklist in docs/MWA_PLUGIN.md
name: android build

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/prep-dist.mjs"
      - ".github/workflows/android-build.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      platform_ref:
        description: "Branch/tag of clucknorrisapp/cluck-norris-school to build the Seeker frontend from (default: develop)"
        required: false
        default: develop

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: the Capacitor 8 CLI hard-refuses anything below 22 ("The Capacitor CLI
      # requires NodeJS >=22.0.0") and exits 1 at `cap sync`.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK; this just puts the tooling on PATH and
      # accepts licences so Gradle does not stop to ask.
      #
      # `packages: ''` is load-bearing. The action's default is `tools platform-tools`, and
      # `tools` is an OBSOLETE SDK package that sdkmanager no longer serves — it answers
      # "Warning: Failed to find package 'tools'" and exits 1, which fails this step before a
      # single line of our own code runs. The runner image already has platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: install deps
        run: npm ci

      # Cheap, and it guards the one thing that would otherwise fail on release night: the
      # bundle content rules are per-variant, and the seeker variant legitimately ships the
      # wallet/signing content the education variants forbid.
      - name: bundle guard test
        run: node scripts/prep-dist-guard-test.mjs

      # A placeholder dist is all the solana target needs — its capacitor config points at the
      # live site, so the bundle is not what is under test here. The Kotlin is.
      - name: prepare web assets
        run: npm run prep:solana

      - name: capacitor sync
        run: npx cap sync android

      - name: assemble debug APK
        id: assemble
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # The whole point: something a human can install on a phone.
      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cluck-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # Runs when ASSEMBLE fails: a Kotlin error is the single most useful thing this workflow
      # can report, and it should not be buried in a collapsed log group.
      #
      # ⚠️ Gated on the assemble step specifically, not on a bare `if: failure()`. A bare one
      # re-ran Gradle after an EARLIER step died, in a tree with no node_modules and no
      # `cap sync`, and produced a confident, completely unrelated error about a missing
      # cordova.variables.gradle. A whole diagnosis was spent on that phantom. A fallback that
      # can run in a state its command does not support does not report failures — it invents
      # them.
      - name: compile errors, if any
        if: failure() && steps.assemble.outcome == 'failure'
        working-directory: android
        run: ./gradlew --no-daemon compileDebugKotlin --stacktrace 2>&1 | tail -80 || true

  # ── An installable APK of the ACTUAL mobile-first app, not the thin shell. ──
  #
  # The `assemble` job above builds the `solana` target: a Capacitor shell pointed at the live
  # website. It answers "does the Kotlin compile", and it is the wrong thing to put on a phone if
  # the question is "does the Seeker app work". The Seeker target needs a pinned, checksummed
  # release, and that needs a tag only the owner can push — so until now there was no way for
  # ANYONE to install the mobile-first app. "We built it" and "someone can use it" were separated
  # by a release tag.
  #
  # This job builds the frontend from the main repo's source, runs it through the same seeker
  # content rules the release path uses, and produces a DEBUG APK under its own applicationId
  # (app.clucknorris.seeker.dev) so it can sit beside the real app on the same device and can
  # never be mistaken for it. It is deliberately NOT a release path — see prep-dist.mjs.
  seeker-dev-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The ref is an input so a Seeker APK can be built from a PR BRANCH without merging it
      # first. That matters: review and device-testing want the same build, and pushing to
      # develop just to get an installable is exactly the pressure that skips review.
      - name: check out the platform repo (the frontend lives there)
        uses: actions/checkout@v4
        with:
          repository: clucknorrisapp/cluck-norris-school
          ref: ${{ inputs.platform_ref || 'develop' }}
          path: platform

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: build the Seeker frontend from source
        working-directory: platform
        run: |
          npm ci
          node scripts/build-store-edition.mjs seeker

      - name: install wrapper deps
        run: npm ci

      # The bundle is unpinned by design here, so the mode refuses unless it is asked for
      # explicitly. It still runs the seeker content scan — a dev build that skipped a check the
      # release makes would let you test a bundle the real build would have refused.
      - name: stage the dev bundle
        env:
          CLKN_SEEKER_DEV: "1"
        run: |
          TGZ=$(ls platform/release/store-edition-seeker-*.tgz | head -1)
          echo "using $TGZ"
          CLKN_SEEKER_DEV_TGZ="$PWD/$TGZ" npm run prep:seeker-dev

      - name: capacitor sync
        env:
          CLKN_TARGET: seeker
        run: npx cap sync android

      - name: assemble the dev Seeker APK
        id: assemble_seeker
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug -PclknAppId=app.clucknorris.seeker.dev

      # Positive control for the play-dev job's "no wallet layer" probe: the same strings MUST be
      # present here, or that probe proves nothing. (Default clknWallet — the wallet source set.)
      - name: the Seeker APK HAS the wallet layer
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -p "$APK" 'classes*.dex' | strings | grep -q 'CluckMWAPlugin' && echo "✓ CluckMWAPlugin present"
          unzip -p "$APK" 'classes*.dex' | strings | grep -q 'MobileWalletAdapter' && echo "✓ MobileWalletAdapter present"
          unzip -p "$APK" AndroidManifest.xml | strings -e l | grep -q 'solana-wallet' && echo "✓ solana-wallet query present"

      - name: upload the dev Seeker APK
        uses: actions/upload-artifact@v4
        with:
          name: cluck-seeker-dev-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: compile errors, if any
        if: failure() && steps.assemble_seeker.outcome == 'failure'
        working-directory: android
        run: ./gradlew --no-daemon compileDebugKotlin --stacktrace 2>&1 | tail -80 || true

  # The Google Play / iOS EDITION of the same shell (main repo store-edition v1.1.0), as an
  # installable debug APK — the twin of seeker-dev-apk. Built from the platform ref with the
  # EDUCATION rules (no wallet, no payments, no address; the main repo's own verifier and this
  # repo's prep-dist scan both run), under its own applicationId (app.clucknorris.edu.dev) so it
  # sits beside the real store app and the Seeker dev app on one phone and can never be mistaken
  # for either. Not a release path — see prep-dist.mjs `play-dev`.
  play-dev-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: check out the platform repo (the frontend lives there)
        uses: actions/checkout@v4
        with:
          repository: clucknorrisapp/cluck-norris-school
          ref: ${{ inputs.platform_ref || 'develop' }}
          path: platform

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: build the education-edition frontend from source
        working-directory: platform
        run: |
          npm ci
          node scripts/build-store-edition.mjs google

      - name: install wrapper deps
        run: npm ci

      - name: stage the dev bundle (education rules enforced)
        env:
          CLKN_PLAY_DEV: "1"
        run: |
          TGZ=$(ls platform/release/store-edition-google-*.tgz | head -1)
          echo "using $TGZ"
          CLKN_PLAY_DEV_TGZ="$PWD/$TGZ" npm run prep:play-dev

      - name: capacitor sync
        env:
          CLKN_TARGET: googlePlay
        run: npx cap sync android

      - name: assemble the dev Play-edition APK
        id: assemble_play
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug -PclknAppId=app.clucknorris.edu.dev -PclknWallet=false

      # The education edition promises "no wallet" on its store legal pages. `-PclknWallet=false`
      # is supposed to leave the Mobile Wallet Adapter bridge, its client library and the merged
      # "solana-wallet" <queries> entry out of the binary — this reads the APK to prove it did,
      # because the first Play-dev APK (2026-09-21) carried all three while every source-level
      # check said "no wallet". The seeker-dev job runs the same probe as a positive control.
      - name: the Play-edition APK has no wallet layer
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "probing $APK"
          fail=0
          if unzip -p "$APK" 'classes*.dex' | strings | grep -q 'MobileWalletAdapter'; then echo "✗ MobileWalletAdapter classes are in the dex"; fail=1; else echo "✓ no MobileWalletAdapter class"; fi
          if unzip -p "$APK" 'classes*.dex' | strings | grep -q 'CluckMWAPlugin'; then echo "✗ CluckMWAPlugin is in the dex"; fail=1; else echo "✓ no CluckMWAPlugin class"; fi
          if unzip -p "$APK" AndroidManifest.xml | strings -e l | grep -q 'solana-wallet'; then echo "✗ manifest queries the solana-wallet scheme"; fail=1; else echo "✓ manifest has no solana-wallet query"; fi
          if ! unzip -p "$APK" AndroidManifest.xml | strings -e l | grep -q 'app.clucknorris.edu.dev'; then echo "✗ manifest is not the edu.dev app id"; fail=1; else echo "✓ app id app.clucknorris.edu.dev"; fi
          if ! unzip -l "$APK" | grep -q 'assets/public/DEV_BUILD_DO_NOT_PUBLISH.txt'; then echo "✗ dev stamp missing"; fail=1; else echo "✓ stamped do-not-publish"; fi
          exit $fail

      - name: upload the dev Play-edition APK
        uses: actions/upload-artifact@v4
        with:
          name: cluck-play-dev-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: compile errors, if any
        if: failure() && steps.assemble_play.outcome == 'failure'
        working-directory: android
        run: ./gradlew --no-daemon compileDebugKotlin --stacktrace 2>&1 | tail -80 || true
