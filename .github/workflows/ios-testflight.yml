# Ship an iOS build to TestFlight — signed with a `.p12` Apple Distribution identity.
#
# Written 2026-09-24, revised in the same PR's fix round. Companion to android-build.yml, same
# house rule: nothing here weakens the store-edition pin. `npm run build:ios` calls `prep:store`,
# which downloads and verifies the PINNED, CHECKSUMMED ios release from store-edition.lock
# (scripts/prep-dist.mjs) — this workflow never bypasses that, and never should.
#
# Manual trigger only (workflow_dispatch). There is no push trigger: an iOS archive + upload
# costs real minutes on a macOS runner and touches App Store Connect, so it runs on request, not
# on every push the way android-build.yml's compile check does.
#
# SIGNING. PRIMARY and REQUIRED path: a pre-issued `.p12` Apple Distribution identity, imported
# into a throwaway CI keychain before archiving — repository secrets IOS_DIST_P12_BASE64 and
# IOS_DIST_P12_PASSWORD. This is required, not optional: cloud-managed distribution signing
# (`-allowProvisioningUpdates` minting a NEW distribution certificate) needs an App Store Connect
# API key with the Admin role, and the key on this repo is deliberately App Manager — the owner's
# key stays that way; see docs/IOS_TESTFLIGHT.md for why. App Manager CAN create the App Store
# *provisioning profile* (not a new certificate) via `-allowProvisioningUpdates`, so that flag
# stays on the archive/export calls for that purpose only — never for minting a certificate. If
# the two `.p12` secrets are absent, the archive step fails FAST with a message pointing at
# docs/IOS_TESTFLIGHT.md, rather than limping into a cloud-signing attempt that is expected to
# fail on this account's key role.
#
# RUNNER. macos-15 — at the time this was written it is the newest macOS label GitHub documents
# for hosted runners (macos-26 / a later "-latest" alias may exist by the time this runs; if
# `macos-15` is ever retired, GitHub's own deprecation notice on the Actions run is the signal to
# bump this literal, not a guess). A step near the top selects the newest installed Xcode
# explicitly and logs its version + iOS SDK — Apple can reject an already-uploaded build after
# processing (ITMS-90725, "unsupported Xcode/SDK") days later, and the runner log is the only
# record of what actually built it once that happens.
#
# What a green run here does and does not mean:
#   ✅ the app archives, exports/signs for App Store distribution, and (when submit=true)
#      uploads to App Store Connect
#   ❌ it does NOT mean Apple has finished processing the build, or that TestFlight review has
#      passed — that is Apple's own pipeline, 10-30 minutes after a successful upload, and no CI
#      step here can see the outcome of it.
#   ⚠️ even submit=false still talks to Apple: `-allowProvisioningUpdates` on the archive/export
#      steps can create or renew the App Store provisioning profile on the team account. It is
#      not a fully offline dry run.

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          MARKETING_VERSION to stamp on the build. Leave blank to use the version currently
          pinned for ios in store-edition.lock (e.g. "1.1.1") — that pin is read at run time, not
          hardcoded here, so it never drifts from this default description.
        required: false
        default: ""
      build_number:
        description: >-
          CURRENT_PROJECT_VERSION (build number). Leave blank to use
          "<run number><run attempt>" (e.g. run 42, first attempt -> 421). Re-running a FAILED
          upload reuses the same run number, and TestFlight requires each build number to be
          strictly higher than the last — the attempt digit is what keeps a re-run from colliding
          with the failed one. If you supply your own value here on a re-run, bump it yourself.
        required: false
        default: ""
      submit:
        description: "Upload to App Store Connect / TestFlight. false = archive + export only, .ipa is an artifact."
        required: false
        type: boolean
        default: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SCHEME: App
      PROJECT_PATH: ios/App/App.xcodeproj
      ARCHIVE_PATH: build/App.xcarchive
      EXPORT_PATH: build/export
      TEAM_ID: "6WAQ6L3CN3"
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: the Capacitor 8 CLI hard-refuses anything below 22 ("The Capacitor CLI
      # requires NodeJS >=22.0.0") and exits 1 at `cap sync` — same trap as android-build.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: install deps
        run: npm ci

      # Same content-scan guard android-build.yml runs. Cheap, and it is the one automated check
      # that the pinned bundle's variant rules (education vs. seeker) still hold.
      - name: bundle guard test
        run: node scripts/prep-dist-guard-test.mjs

      # Explicit Xcode selection. macos-15 images ship more than one Xcode version side by side;
      # relying on whatever `xcode-select` happens to default to means a build can silently sign
      # with an SDK Apple later rejects post-upload (ITMS-90725) with no trace of which one it
      # was. Pick the highest-versioned /Applications/Xcode*.app and log both the Xcode and SDK
      # version so that trace exists.
      - name: select Xcode and log its version
        run: |
          set -euo pipefail
          XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$XCODE_APP" ]; then
            echo "no /Applications/Xcode*.app found on this runner image" >&2
            exit 1
          fi
          echo "selecting: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          echo "--- iOS SDKs available ---"
          xcodebuild -showsdks | grep iphoneos

      # Resolve the effective version/build BEFORE anything touches Xcode. workflow_dispatch
      # input `default:` cannot hold an expression (no ${{ }} evaluation there), so "default to
      # the lock's pin" / "default to the run number" both have to be resolved here, not in the
      # trigger block above. Inputs are passed via env (never interpolated into the script body)
      # and validated — a workflow_dispatch input is operator-controlled but still untrusted
      # enough that it should never reach a shell unchecked.
      - name: resolve version and build number
        id: resolve
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          VERSION="$IN_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "JSON.parse(require('fs').readFileSync('store-edition.lock','utf8')).ios.version")
            echo "no version input — using store-edition.lock ios pin: $VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "refusing malformed version '$VERSION' — expected N, N.N or N.N.N" >&2
            exit 1
          fi

          BUILD="$IN_BUILD"
          if [ -z "$BUILD" ]; then
            BUILD="${{ github.run_number }}${{ github.run_attempt }}"
            echo "no build_number input — using run number + attempt: $BUILD"
          fi
          if ! [[ "$BUILD" =~ ^[0-9]+$ ]]; then
            echo "refusing malformed build_number '$BUILD' — expected digits only" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # CLKN_TARGET=ios inside the npm script: verifies + downloads the PINNED store-edition
      # release for ios (scripts/prep-dist.mjs `store` mode) into dist/, then `cap sync ios`
      # copies it into ios/App/App/public and refreshes the Capacitor Swift package list. This
      # is the only source of dist/ content in this workflow — never write dist/ by hand here.
      - name: build:ios (prep + cap sync)
        run: npm run build:ios

      # Capacitor 8 with the CapApp-SPM local Swift package generates NO .xcworkspace — Podfile
      # integration is what produces one, and this project has none (no CocoaPods anywhere in
      # ios/). `find` here isn't decorative: if a future `cap sync` ever starts emitting a
      # workspace (e.g. a plugin that adds CocoaPods), this fails loudly instead of silently
      # building the stale .xcodeproj target next to an unused .xcworkspace.
      - name: confirm workspace vs. project shape
        run: |
          set -euo pipefail
          # A STANDALONE ios/App/App.xcworkspace (as opposed to the project.xcworkspace nested
          # inside every .xcodeproj, which is not what this checks) only appears once CocoaPods
          # integration runs (`pod install`). There is no Podfile anywhere in ios/ today — the
          # Capacitor Swift package (CapApp-SPM) covers the native deps — so this builds
          # App.xcodeproj directly. If a future plugin adds CocoaPods, this fails loudly instead
          # of silently building the now-stale .xcodeproj target next to the real .xcworkspace.
          if [ -d "ios/App/App.xcworkspace" ] || [ -f "ios/App/Podfile" ]; then
            echo "A standalone .xcworkspace or Podfile now exists — this build must switch to '-workspace ios/App/App.xcworkspace' instead of '-project $PROJECT_PATH'." >&2
            exit 1
          fi
          echo "confirmed: SPM-only project (CapApp-SPM), no CocoaPods, no standalone .xcworkspace — building $PROJECT_PATH directly."

      # Never echoed, never logged. xcodebuild / altool look for API keys under
      # ~/private_keys/AuthKey_<ID>.p8 by convention. Still required: the same key authenticates
      # the -allowProvisioningUpdates profile step and the export/upload.
      - name: write the App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_API_KEY_P8" ] || [ -z "$ASC_API_KEY_ID" ]; then
            echo "ASC_API_KEY_P8 / ASC_API_KEY_ID are not both set — see docs/IOS_TESTFLIGHT.md." >&2
            exit 1
          fi
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          # Fail HERE with a plain message rather than at xcodebuild's
          # "Invalid authentication key credential (invalidPEMDocument)" (first run, 2026-09-24):
          # the secret must be the .p8 file's text, BEGIN/END lines included. Nothing about the
          # key is printed — only its byte count and whether it parses.
          if ! head -1 ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 | grep -q -- '-----BEGIN PRIVATE KEY-----' \
             || ! openssl pkey -in ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 -noout 2>/dev/null; then
            echo "ASC_API_KEY_P8 is not a valid .p8 private key (got $(wc -c < ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8) bytes)." >&2
            echo "Re-set the secret with the FILE'S TEXT: on the Mac, 'cat ~/path/to/AuthKey_${ASC_API_KEY_ID}.p8 | pbcopy' then paste. See docs/IOS_TESTFLIGHT.md." >&2
            exit 1
          fi
          echo "API key file parses (PEM private key)."

      # REQUIRED, not optional: the `.p12` Apple Distribution identity is the only signing path
      # this workflow supports (see the file header for why cloud/managed signing does not fit
      # this account's App Manager key). Fails fast with a message naming the doc rather than
      # limping into an archive step that is expected to fail on "no signing certificate".
      #
      # The keychain password is generated fresh per run (never derived from a secret), masked
      # before it ever reaches $GITHUB_ENV, and the keychain is deleted in the always() cleanup
      # step below.
      - name: import distribution certificate (required)
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_DIST_P12_BASE64" ] || [ -z "$IOS_DIST_P12_PASSWORD" ]; then
            echo "IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD are not both set." >&2
            echo "This workflow requires a pre-issued .p12 Apple Distribution identity — see the" >&2
            echo "'Signing' section of docs/IOS_TESTFLIGHT.md for how to export and add it." >&2
            exit 1
          fi

          KEYCHAIN=ci-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/$KEYCHAIN"

          P12_PATH="$RUNNER_TEMP/dist.p12"
          echo "$IOS_DIST_P12_BASE64" | base64 --decode > "$P12_PATH"
          security import "$P12_PATH" -k "$RUNNER_TEMP/$KEYCHAIN" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/$KEYCHAIN"
          security list-keychains -d user -s "$RUNNER_TEMP/$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$P12_PATH"

      # ARCHIVE — signs with the imported Apple Distribution identity (CODE_SIGN_IDENTITY, via
      # CODE_SIGN_STYLE=Automatic so Xcode matches it against the identity in the keychain).
      # -allowProvisioningUpdates is kept ONLY so the App Manager key can create/renew the App
      # Store *provisioning profile* to pair with that identity — it is not asked to mint a new
      # certificate, which is the one thing this account's key role cannot do.
      # -allowProvisioningDeviceRegistration is REMOVED: an App Store distribution archive never
      # needs to register a device, and the flag has no purpose here.
      - name: archive (xcodebuild, signed with the imported Apple Distribution identity)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="${{ steps.resolve.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.resolve.outputs.build }}" \
            2>&1 | tee build/archive.log

      # method "app-store-connect" is the Xcode 15+ name; "app-store" is kept working by Xcode as
      # an alias for older tooling. destination:
      #   - submit=true  → "upload": xcodebuild both re-signs for the store AND uploads to App
      #     Store Connect in the same -exportArchive call — there is no separate upload step.
      #   - submit=false → "export": produces build/export/*.ipa locally and stops there.
      #
      # `inputs.submit` is a boolean input; GitHub Actions expressions compare a boolean against
      # the string 'true' as a NUMBER, not lexically (`inputs.submit != 'true'` coerces 'true' to
      # NaN and is always true regardless of the input) — so every check below uses `!inputs.submit`
      # / `inputs.submit` directly in `if:`, and `"${{ inputs.submit }}" = "true"` in shell, where
      # the expression has already been substituted to the literal word `true` or `false`.
      - name: write ExportOptions.plist
        run: |
          set -euo pipefail
          DESTINATION="export"
          if [ "${{ inputs.submit }}" = "true" ]; then
            DESTINATION="upload"
          fi
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>${DESTINATION}</string>
          </dict>
          </plist>
          PLIST
          echo "destination=$DESTINATION" >> "$GITHUB_ENV"

      # EXPORT (+ upload, when destination=upload). Same authentication flags as the archive step
      # (for the provisioning-profile side of -allowProvisioningUpdates) — the export/upload call
      # authenticates independently.
      - name: export (and upload, if submit=true)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log

      # Only meaningful (and only present) when destination=export — an upload leaves nothing
      # local to publish an artifact from. See the boolean-input note above the ExportOptions
      # step for why this is `!inputs.submit`, not `inputs.submit != 'true'`.
      - name: upload .ipa artifact (archive + export only, submit=false)
        if: ${{ !inputs.submit }}
        uses: actions/upload-artifact@v4
        with:
          name: cluck-ios-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      # Runs whenever the job failed — the xcodebuild logs are the single most useful thing this
      # workflow can report, same reasoning as android-build.yml's "compile errors, if any" step.
      - name: upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 30

      # Always runs, success or failure: never leave a signing identity behind on the runner.
      - name: delete the temporary signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
            security list-keychains -d user -s $(security list-keychains -d user | sed 's/"//g' | grep -v "$(basename "$KEYCHAIN_PATH")") || true
          fi

      - name: summary
        if: success()
        run: |
          echo "version:       ${{ steps.resolve.outputs.version }}"
          echo "build number:  ${{ steps.resolve.outputs.build }}"
          if [ "${{ inputs.submit }}" = "true" ]; then
            echo "uploaded — processing takes 10-30 minutes; it appears under TestFlight in App Store Connect."
          else
            echo "submit=false — archived and exported only. The .ipa is the 'cluck-ios-ipa' artifact on this run, not uploaded."
          fi
