// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    // CluckMWA (android/app/src/main/java/app/clucknorris/school/mwa/CluckMWAPlugin.kt) is the
    // one Kotlin file in an otherwise all-Java app — the official Solana Mobile client library
    // (com.solanamobile:mobile-wallet-adapter-clientlib-ktx) is Kotlin-first (suspend functions),
    // so the plugin is written in Kotlin against it rather than fighting Java interop with
    // coroutines. This is the only reason the Kotlin Gradle plugin is here.
    // Version pin: 2.2.21 is the exact Kotlin Gradle plugin version Solana Mobile itself built
    // mobile-wallet-adapter-clientlib-ktx 2.1.1 against (android/gradle/libs.versions.toml in the
    // solana-mobile/mobile-wallet-adapter repo at tag v2.1.1) — a combination that is known to
    // compile together, not a guess.
    ext.kotlin_version = '2.2.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
