# Solana dApp Store publishing config — DRAFT
# Consolidates the approved listing copy + assets. Field names follow the
# Solana Mobile publishing schema, but VALIDATE/FINALIZE against the dapp-store
# CLI in Phase C (e.g. `npx dapp-store ...`) before submitting. TODOs marked below.

publisher:
  name: Cluck Norris
  website: https://clucknorris.app
  email: clucknorrisapp@gmail.com
  media:
    - purpose: icon
      uri: ./icon.png

app:
  name: Cluck Norris
  android_package: app.clucknorris.school
  urls:
    license_url: https://clucknorris.app
    copyright_url: https://clucknorris.app
    # /privacy exists (server.js app.get("/privacy")). The TODO that used to sit here,
    # saying it did not, was stale.
    privacy_policy_url: https://clucknorris.app/privacy
    website: https://clucknorris.app
  media:
    - purpose: icon
      uri: ./icon.png

release:
  catalog:
    en-US:
      name: Cluck Norris
      subtitle: Crypto School and Tools
      # NOTE: trim if the CLI enforces a shorter limit (fallback: "Free crypto school + token tools")
      short_description: Free crypto school + Solana token-safety tools
      long_description: |
        "No participation trophies. No hand-holding. Just hard knocks."

        Cluck Norris is a free school of crypto hard knocks plus a suite of
        Solana token-research tools — built to keep first-timers alive long
        enough to actually use crypto.

        FREE SCHOOL, FOREVER — no signup, no wallet:
        - The Incubator: 7 beginner lessons (wallets, tokens, on/off-ramps, DEXs, liquidity)
        - School of Hard Knocks: 12 lessons, Freshman to Emeritus belt ranking
        - LP Lab: a 12-lesson liquidity course with 7 interactive tools
        - Ask Cluck: a tough-love AI crypto professor on the home screen and in every lesson
        - "Where do I start?": a concierge that routes newcomers to the right first step

        FREE TOKEN RESEARCH for any Solana mint:
        - Token Autopsy: an AI forensic post-mortem on any mint
        - Wallet Safety Checkup: read-only scan for approvals, honeypots, freeze/mint risk
        - Live Bags.fm launch feed: every new launch, real-time prices, trade links

        HEAVY TOOLS behind one unified pass — batch airdrop sender,
        buy-competition trackers, wallet forensics. Connect a wallet and either
        hold CLKN to use them free, or buy a short-term all-tools pass in SOL.
        No subscription, no fiat, no custody.

        Guardrails first — every action that costs money or cannot be undone
        requires an "I understand" step naming the exact consequence, every page
        shows a stay-safe checklist, and the app never takes custody or asks for
        your seed phrase.
      new_in_version: Initial release — the full Cluck Norris school and Solana token toolkit, now native on Solana Mobile.
  media:
    - purpose: icon
      uri: ./icon.png
    - purpose: banner
      uri: ./banner.png
    # ⚠️ SCREENSHOTS NEED RECAPTURE before the next dApp Store republish — the old
    # notes referenced RETIRED features (Ultimate Challenge, Cluck Score, Survival
    # Simulator). Recapture from the CURRENT app: lead with the AI (Ask Cluck on the
    # home screen + the "Where do I start?" concierge); drop any retired-feature shots.
    - purpose: screenshot
      uri: ./screenshots/01-home.png        # landing hero: brand + Ask Cluck + "Where do I start?"
    - purpose: screenshot
      uri: ./screenshots/02-school.png      # school home: ranks, Start School
    - purpose: screenshot
      uri: ./screenshots/03-lp-lab.png      # LP Lab lessons
    - purpose: screenshot
      uri: ./screenshots/04-tools.png       # Tools: Token Autopsy, Security Coop, Wallet Checkup, Hatchery
    - purpose: screenshot
      uri: ./screenshots/05-ask-cluck.png   # Ask Cluck AI tutor  (was 05-survival — Survival retired)
    - purpose: screenshot
      uri: ./screenshots/06-bags.png        # live Bags.fm launch feed
    - purpose: screenshot
      uri: ./screenshots/07-lesson-wallet.png  # "What is a Wallet?" lesson
  files:
    # TODO: copy the signed release APK here (or point to its build path) at submission time
    - purpose: install
      uri: ./app-release.apk

solana_mobile_dapp_publisher_portal:
  # google_store_package: omitted — not published on Google Play
  testing_instructions: |
    No account, login, or wallet connection is required to review the app. Open
    it and the School, Library, LP Lab, and the free tools (/autopsy,
    /wallet-checkup, the live Bags feed) are fully usable immediately, with no
    wallet and no signup.

    The heavy tools DO need a connected wallet. They preview for free; running
    one resolves a "tools pass" against the connected wallet, which is satisfied
    either by holding CLKN or by a one-click SOL payment for a short-term pass.
    Current terms are served live from /api/tool-gate/config rather than fixed in
    this listing, so quoting an amount here would go stale. There is no fiat
    payment, no subscription, and the app never takes custody of funds.

    The app is a thin client that loads the live clucknorris.app site, so an
    internet connection is required.
