# Solana dApp Store publishing config — the SEEKER EDITION as its OWN NEW LISTING
# (android_package app.clucknorris.seeker), the bundled, mobile-first app built for the Solana
# Mobile CLOCK IN hackathon (docs/SEEKER_TARGET.md in this repo; docs/SEEKER_APP_PLAN.md in the
# platform repo).
#
# ⚠️ Owner, 2026-10-04: a NEW listing, not an update. The 2026-10-03 plan (replace the live
# app.clucknorris.school listing) needed that listing's signing key, and it could not be located;
# an update signed with any other key is refused by Android and by the dApp Store. So: same
# publisher (wallet 4Ws6jXEGQ7MG61Ke8qiuGrXhdcYX2NNVCtg3xRMsuLs8 — the owner / update authority of
# the live App NFT AkZnKGXUdKz8MUGEjjgsqsgMH6xXr1LxhQ59sZiumWUs), a NEW app NFT for this package, a
# fresh key (android/keystore.seeker.properties, gitignored — generated on the Mac,
# docs/CLOCK_IN_MAC_RUNBOOK.md §2), the APK from `npm run build:seeker` (versionCode 1 / 1.0.1).
# The live 1.0 listing stays as it is; whether it is ever retired is the owner's later call.
#
# ⚠️ HOW THIS FILE IS USED (Codex on 059d26f, P2; docs.solanamobile.com/dapp-store read 2026-10-04):
# the config-driven CLI flow (validate / create app / create release / publish submit) is legacy and
# gone from @solana-mobile/dapp-store-cli. A NEW app is created in the Publisher Portal UI and the
# CLI only ships releases (--apk-file / --apk-url, --keypair, API key on stdin) to an app that
# already exists there. So this file is the SOURCE the owner copies into the portal's "New dApp"
# form — texts, URLs, icon, banner, screenshots — not an input the CLI parses. Keep it true to the
# pinned build all the same: it is what the listing will say. docs/CLOCK_IN_MAC_RUNBOOK.md §7.
#
# It describes the app as built from the platform repo's main @ ae3ee798 (store-seeker-v1.0.0);
# anything not shipped by submission day must come out of this text before it is used.
# ⚠️ THE SCHOOL LEADS (owner, 2026-10-04: "Rent reclaim sure as heck shouldn't be a focus … the
# school is the focus"). The listing text opens with the school, then Ask, the Daily, the Toolkit
# with Swap first, then the pass. Rent Reclaim is one card among the wallet tools, not "start here".
# Screenshots captured 2026-09-24 with Playwright from a statically served Seeker build against
# clucknorris.app's live, read-only APIs — no wallet, no signing, no mocked data — not from a
# device. Validate against the dapp-store CLI before submitting.
#
# ⛔ Not a hackathon requirement: dApp Store publishing is only required of WINNERS, within 30
# days of the announcement. Keep this ready; do not publish it before the owner says so.

