release:
  catalog:
    en-US:
      name: Cluck Norris for Seeker
      subtitle: Crypto school and wallet tools, built for the phone
      short_description: Get your rent back, learn the hard knocks, and run real Solana tools from your Seeker
      long_description: |
        "No participation trophies. No hand-holding. Just hard knocks."

        Cluck Norris for Seeker is the School of Crypto Hard Knocks rebuilt for the phone: the
        free school bundled on the device, and fourteen Solana tools — the ones that act on your
        tokens connect to your wallet through Mobile Wallet Adapter and sign on the phone.

        START HERE — RENT RECLAIM
        Dead token accounts are holding your SOL. Rent Reclaim shows exactly which accounts
        can be closed and how much comes back, then closes them with your wallet's approval.
        Every new token you touch leaves another account behind, so it is worth checking again
        later. We charge nothing for getting your own money back; the network fee for each close
        is shown before you approve it.

        THE SCHOOL — free, on the device, works with no signal
        - 58 lessons across four courses, quizzes on most of them, belt ranks; your progress
          stays on this phone
        - Ask Cluck, a tough-love AI professor
        - Seven languages: English, Spanish, Hindi, Italian, Portuguese, Vietnamese, Chinese

        FREE, NO PASS
        - Listing Checkup: the checks listing venues run on a token, run on yours first
        - The Daily: today's lesson, one question, and where the majors closed
        - Wallet Checkup: your connected wallet, or any address you paste — its approvals,
          freeze and mint authority, and what each one lets someone do

        WITH YOUR WALLET — signed on the phone, free
        - Rent Reclaim (above)
        - The Airdropper: a token to many wallets at once, with a public receipt for every
          row. No pass, no fee from us — you pay only the network's own fees and rent
        - Firepit: burn worthless junk and reclaim the SOL under it, everything priced first
        - Project Burn: burn project supply and get a verifiable on-chain receipt
        - The Locker Room: lock tokens on Jupiter Lock, non-custodially, with public proof

        THE HEAVY TOOLS — one unified tools pass
        - Wallet X-Ray, Holders, Trace: what a wallet did, who holds a token, where money went
        The pass is free while you hold CLKN worth its stated dollar amount — or, in this app,
        SKR worth its own stated amount. Otherwise a small one-off SOL payment buys a short pass
        to all of them. The current terms are shown live in the app. Nothing is gated behind
        SKR, least of all Rent Reclaim.

        THE HATCHERY — priced per mint, not part of the pass
        - Mint a token properly, with the authorities set the way you meant. One fee per mint,
          in SOL or, at a discount, in CLKN; the price is shown before you confirm.

        WHAT IT NEVER DOES
        It never takes custody. It never asks for your seed phrase. Every action that costs
        money or cannot be undone names its exact consequence before you confirm it, and a
        transaction that did not land is reported as not landed, never as done.
      new_in_version: |
        First release of the Seeker edition: the school bundled on the device, Rent Reclaim,
        Firepit, Project Burn and the Locker Room signing through Mobile Wallet Adapter, the
        Airdropper with receipts (free for everyone), in-app swap and approval revoke, and the
        tools pass with the SKR door — payable in SKR, too.
  media:
    - purpose: icon
      uri: ./icon.png
    - purpose: banner
      uri: ./banner.png
    # Captured 2026-09-24, real build, in flagship order (AGENTS.md: "the school leads"):
    - purpose: screenshot
      uri: ./screenshots-seeker/01-home.png          # school home: progress, continue card, course list
    - purpose: screenshot
      uri: ./screenshots-seeker/02-school-course.png # The Incubator: a course's lesson list
    - purpose: screenshot
      uri: ./screenshots-seeker/03-lesson.png        # "What is a Wallet?" open, real lesson body
    - purpose: screenshot
      uri: ./screenshots-seeker/04-ask-cluck.png     # Ask Cluck: a typed question, a real AI answer
    - purpose: screenshot
      uri: ./screenshots-seeker/05-wallet-checkup.png # Wallet Checkup on the treasury address, real scan result
    - purpose: screenshot
      uri: ./screenshots-seeker/06-tools.png         # the Toolkit grid: Firepit, Locker Room, Project Burn and more
    - purpose: screenshot
      uri: ./screenshots-seeker/07-rent-reclaim.png  # Rent Reclaim, no-wallet preview state
  files:
    # The release APK built by `npm run build:seeker` from the pinned release (docs/SEEKER_TARGET.md).
    - purpose: install
      uri: ./app-seeker-release.apk

solana_mobile_dapp_publisher_portal:
  testing_instructions: |
    No account or login. The school, Ask Cluck, Listing Checkup, Wallet Checkup (any pasted
    address) and the Daily work with no wallet; the school works with no signal. Wallet
    Checkup also reads the connected wallet when there is one.

    Rent Reclaim, the Airdropper, Firepit, Project Burn and the Locker Room connect through
    Mobile Wallet Adapter and sign on the device, free; each one previews what it will do and
    names the exact consequence before the wallet is asked to approve.

    Wallet X-Ray, Holders and Trace run on the unified tools pass: hold CLKN
    worth its stated dollar amount or SKR worth its own, or make a small one-off SOL
    payment. The Hatchery is separate: one fee per mint, in SOL or CLKN, shown before
    confirming. Terms are served live in the app and are not fixed here. No fiat, no
    subscription, no custody, no seed phrase.

    An internet connection is needed for every tool; the school is bundled and is not.
