release:
  catalog:
    en-US:
      name: Cluck Norris for Seeker
      subtitle: The crypto school that tells you the truth, with real tools built in
      short_description: Learn the hard knocks for free, then connect your wallet and use real Solana tools from your Seeker
      long_description: |
        "No participation trophies. No hand-holding. Just hard knocks."

        People lose money in crypto because nobody told them the truth plainly. Cluck Norris
        for Seeker is the School of Crypto Hard Knocks on your phone: a free school that works
        with no signal, a toolkit of real Solana tools that sign with your own wallet, and a
        daily page to come back to.

        THE SCHOOL — free, on the device, works with no signal
        - 64 lessons across four courses, from The Incubator (no wallet, no jargon) to the LP
          Lab (how liquidity actually works, and how it takes your money)
        - Quizzes on most lessons, belt ranks, and progress that stays on this phone
        - The Library: every term in the school, searchable, linked to the lesson that teaches it
        - The Solana Room: rent, fees, outages, the Seeker itself — the facts, dated and sourced
        - Ten languages: English, Spanish, Hindi, Italian, Portuguese, Vietnamese, Chinese,
          Korean, Turkish, Indonesian

        ASK CLUCK
        A tough-love AI professor who answers the question you actually asked. Free, no wallet.

        THE DAILY
        Today's lesson, one question, and where the majors closed. Something to open every day.

        THE TOOLKIT — connect your wallet, sign on the phone, keep custody
        Everything that acts on your tokens goes through Mobile Wallet Adapter and is signed by
        your wallet on this device. Every action that costs money or cannot be undone names its
        exact consequence before you confirm.
        - Swap: SOL, SKR, CLKN and USDC in the app — rate, minimum received and price impact
          shown before you sign; non-custodial
        - Firepit: burn worthless junk and reclaim the SOL under it, everything priced first
        - Project Burn: burn project supply and get a verifiable on-chain receipt
        - The Locker Room: lock tokens on Jupiter Lock, non-custodially, with public proof
        - The Airdropper: a token to many wallets at once, with a public receipt for every row.
          Free — you pay only the network's own fees and rent
        - Rent Reclaim: dead token accounts are holding your SOL; see which can be closed and how
          much comes back, then close them with your wallet's approval. We charge nothing
        - Wallet Checkup: the connected wallet, or any address you paste — approvals, freeze and
          mint authority, what each one lets someone do, and revoke right there
        - Listing Checkup: the checks listing venues run on a token, run on yours first

        THE HEAVY TOOLS — one unified tools pass
        Wallet X-Ray, Holders and Trace: what a wallet did, who holds a token, where money went.
        Preview any of them free. Running one needs the pass: free while you hold CLKN worth its
        stated dollar amount — or, in this app, SKR worth its own stated amount — otherwise a
        small one-off payment, in SOL or in SKR, buys a seven-day pass to all of them. The
        current terms are shown live in the app. Nothing is gated behind SKR.

        THE HATCHERY — priced per mint, not part of the pass
        Mint a token properly, with the authorities set the way you meant. One fee per mint, in
        SOL or, at a discount, in CLKN; the price is shown before you confirm.

        WHAT IT NEVER DOES
        It never takes custody. It never asks for your seed phrase. It never tells you to buy
        anything. A transaction that did not land is reported as not landed, never as done.
      new_in_version: |
        The Seeker edition: the whole school bundled on the device in ten languages, the Library,
        the Solana Room, the Daily, Ask Cluck, and a Toolkit that signs with your own wallet —
        Swap, Firepit, Project Burn, the Locker Room, the Airdropper, Rent Reclaim, Wallet Checkup
        with revoke, and the tools pass payable in SKR.
  media:
    - purpose: icon
      uri: ./icon.png
    - purpose: banner
      uri: ./banner.png
    # Captured 2026-09-24, real build, in flagship order (AGENTS.md: "the school leads"):
    - purpose: screenshot
      uri: ./screenshots-seeker/01-home.png          # school home: progress, continue card, course list
    - purpose: screenshot
      uri: ./screenshots-seeker/02-school-course.png # The Incubator: a course's lesson list
    - purpose: screenshot
      uri: ./screenshots-seeker/03-lesson.png        # "What is a Wallet?" open, real lesson body
    - purpose: screenshot
      uri: ./screenshots-seeker/04-ask-cluck.png     # Ask Cluck: a typed question, a real AI answer
    - purpose: screenshot
      uri: ./screenshots-seeker/05-wallet-checkup.png # Wallet Checkup on the treasury address, real scan result
    - purpose: screenshot
      uri: ./screenshots-seeker/06-tools.png         # the Toolkit grid: Firepit, Locker Room, Project Burn and more
    - purpose: screenshot
      uri: ./screenshots-seeker/07-rent-reclaim.png  # Rent Reclaim, no-wallet preview state
  files:
    # The release APK built by `npm run build:seeker` from the pinned release (docs/SEEKER_TARGET.md).
    - purpose: install
      uri: ./app-seeker-release.apk

solana_mobile_dapp_publisher_portal:
  testing_instructions: |
    No account or login. The school, Ask Cluck, Listing Checkup, Wallet Checkup (any pasted
    address) and the Daily work with no wallet; the school works with no signal. Wallet
    Checkup also reads the connected wallet when there is one.

    Rent Reclaim, the Airdropper, Firepit, Project Burn and the Locker Room connect through
    Mobile Wallet Adapter and sign on the device, free; each one previews what it will do and
    names the exact consequence before the wallet is asked to approve.

    Wallet X-Ray, Holders and Trace run on the unified tools pass: hold CLKN
    worth its stated dollar amount or SKR worth its own, or make a small one-off SOL
    payment. The Hatchery is separate: one fee per mint, in SOL or CLKN, shown before
    confirming. Terms are served live in the app and are not fixed here. No fiat, no
    subscription, no custody, no seed phrase.

    An internet connection is needed for every tool; the school is bundled and is not.
